name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests, sample quickstart, sample workspace check, and privacy check
        run: npm run validate

      # Playwright requires Node 20+, so browser checks run on the 20.x job only.
      - name: Install Chromium for browser checks
        if: startsWith(matrix.node-version, '20.')
        run: npx playwright install --with-deps chromium

      - name: Run headless browser checks
        if: startsWith(matrix.node-version, '20.')
        run: npm run test:browser

      - name: Run persona end-to-end scorecard
        if: startsWith(matrix.node-version, '20.')
        run: npm run e2e
