<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice application — Northwind Tools</title>
<style>
  body { font-family: Georgia, serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #f7f4ef; }
  h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
  p { line-height: 1.4; }
  label { display: block; margin-top: 1rem; font-family: system-ui, sans-serif; font-size: 0.85rem; }
  input, textarea { width: 100%; box-sizing: border-box; margin-top: 0.3rem; padding: 0.5rem; font-size: 1rem; }
  button { margin-top: 1.2rem; padding: 0.6rem 1rem; font-size: 1rem; }
  .note { font-family: system-ui, sans-serif; background: #fff; border: 1px solid #ddd; padding: 0.8rem 1rem; }
</style>
</head>
<body>
<p class="note">Practice form only. Nothing is sent. The person is fictional.</p>
<h1>Northwind Tools</h1>
<p>Senior Product Manager — practice application</p>
<form>
  <label for="full_name">Full name</label>
  <input id="full_name" name="full_name" value="">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="">
  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" value="">
  <label for="city">City</label>
  <input id="city" name="city" value="">
  <label for="why">Why this role?</label>
  <textarea id="why" name="why" rows="4"></textarea>
  <button type="submit">Submit</button>
</form>
</body>
</html>
